AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  rural-health-navigator

  Rural Health Navigator SAM application — triage + worker status MVP

# Supply GeminiApiKey at deploy time via --parameter-overrides (not stored in this repo).
# No default on purpose: a placeholder default would overwrite a working Lambda key on redeploy.
Parameters:
  GeminiApiKey:
    Type: String
    NoEcho: true
    MinLength: 1
    Description: >
      Gemini API key for triage. Required at deploy time
      (e.g. sam deploy --parameter-overrides GeminiApiKey=...).
      Never commit a real key.

Globals:
  Function:
    Timeout: 30
    MemorySize: 256
    LoggingConfig:
      LogFormat: JSON

Resources:
  FacilitiesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Facilities
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: facilityId
          AttributeType: S
      KeySchema:
        - AttributeName: facilityId
          KeyType: HASH

  TriageSessionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: TriageSessions
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: sessionId
          AttributeType: S
      KeySchema:
        - AttributeName: sessionId
          KeyType: HASH

  TriageNotificationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${AWS::StackName}-triage-notifications'
      DisplayName: Rural Health Navigator triage notifications

  TriageFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: hello-world/
      Handler: bootstrap
      Runtime: provided.al2023
      Architectures:
        - x86_64
      Environment:
        Variables:
          GEMINI_MODEL_ID: gemini-3.5-flash-lite
          GEMINI_API_KEY: !Ref GeminiApiKey
          TRIAGE_SESSIONS_TABLE_NAME: !Ref TriageSessionsTable
          TRIAGE_NOTIFICATIONS_TOPIC_ARN: !Ref TriageNotificationTopic
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
              Resource: !GetAtt TriageSessionsTable.Arn
            - Effect: Allow
              Action:
                - sns:Publish
              Resource: !Ref TriageNotificationTopic
      Events:
        Triage:
          Type: Api
          Properties:
            Path: /triage
            Method: POST

  WorkerStatusFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: worker-status/
      Handler: bootstrap
      Runtime: provided.al2023
      Architectures:
        - x86_64
      Environment:
        Variables:
          FACILITIES_TABLE_NAME: !Ref FacilitiesTable
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:UpdateItem
              Resource: !GetAtt FacilitiesTable.Arn
      Events:
        WorkerStatus:
          Type: Api
          Properties:
            Path: /worker/status
            Method: POST

  WorkerQueueFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: worker-queue/
      Handler: bootstrap
      Runtime: provided.al2023
      Architectures:
        - x86_64
      Environment:
        Variables:
          TRIAGE_SESSIONS_TABLE_NAME: !Ref TriageSessionsTable
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:Scan
              Resource: !GetAtt TriageSessionsTable.Arn
      Events:
        WorkerQueue:
          Type: Api
          Properties:
            Path: /worker/queue
            Method: GET

  ApplicationResourceGroup:
    Type: AWS::ResourceGroups::Group
    Properties:
      Name:
        Fn::Sub: ApplicationInsights-SAM-${AWS::StackName}
      ResourceQuery:
        Type: CLOUDFORMATION_STACK_1_0
  ApplicationInsightsMonitoring:
    Type: AWS::ApplicationInsights::Application
    Properties:
      ResourceGroupName:
        Ref: ApplicationResourceGroup
      AutoConfigurationEnabled: 'true'

Outputs:
  TriageAPI:
    Description: API Gateway endpoint URL for Prod environment for POST /triage
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/triage/"
  WorkerStatusAPI:
    Description: API Gateway endpoint URL for Prod environment for POST /worker/status
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/worker/status/"
  WorkerQueueAPI:
    Description: API Gateway endpoint URL for Prod environment for GET /worker/queue
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/worker/queue/"
  TriageFunction:
    Description: Triage Lambda Function ARN
    Value: !GetAtt TriageFunction.Arn
  WorkerStatusFunction:
    Description: Worker status Lambda Function ARN
    Value: !GetAtt WorkerStatusFunction.Arn
  WorkerQueueFunction:
    Description: Worker queue Lambda Function ARN
    Value: !GetAtt WorkerQueueFunction.Arn
  FacilitiesTableName:
    Description: Facilities DynamoDB table name
    Value: !Ref FacilitiesTable
  TriageSessionsTableName:
    Description: TriageSessions DynamoDB table name
    Value: !Ref TriageSessionsTable
  TriageNotificationTopicArn:
    Description: SNS topic ARN for triage session notifications
    Value: !Ref TriageNotificationTopic
  TriageFunctionIamRole:
    Description: Implicit IAM Role created for Triage function
    Value: !GetAtt TriageFunctionRole.Arn
